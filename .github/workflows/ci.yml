name: Starter checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build

  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip install -e backend --no-deps
      - run: python -m ruff check backend scripts/setup_local.py scripts/lock_backend.py scripts/validate_data.py
      - run: python -m ruff format --check backend scripts/setup_local.py scripts/lock_backend.py scripts/validate_data.py
      - run: python -m pytest
        working-directory: backend
      - run: python scripts/validate_data.py
      - run: python docs/一期样例数据/validate_samples.py

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: trace_test
          MYSQL_USER: trace_ci
          MYSQL_PASSWORD: ci-only-disposable-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      TRACE_TEST_DATABASE_URL: mysql+pymysql://trace_ci:ci-only-disposable-password@127.0.0.1:3306/trace_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip install -e backend --no-deps
      - run: python -m pytest
        working-directory: backend
