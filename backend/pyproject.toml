[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-backend"
version = "0.1.0"
description = "TRACE university career platform foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.0",
  "sqlalchemy==2.0.51",
  "alembic==1.20.0",
  "pydantic-settings==2.14.2",
  "PyJWT==2.10.1",
  "argon2-cffi==25.1.0",
  "pymysql==1.1.2",
  "cryptography==49.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.16.9"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
